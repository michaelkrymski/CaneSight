name: canesight
services:
  backend:
    # Supply a reviewed Python backend image after CS-028/029/032 integration.
    image: ${BACKEND_IMAGE:?Set a reviewed backend image digest}
    # Linux host networking with an explicit loopback bind; no public backend.
    network_mode: host
    command: [python, -m, backend.server, --host, '127.0.0.1', --port, '18083', --forwarded-allow-ips, '127.0.0.1']
    environment:
      CANESIGHT_INTERNAL_PORT: '18083'
    env_file:
      - path: ./secrets/backend.env
        format: raw
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python, /opt/canesight/readiness.py]
      interval: 10s
      timeout: 4s
      start_period: 60s
      retries: 3
    volumes:
      - ./readiness.py:/opt/canesight/readiness.py:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    # Only Caddy/authorized local SSH tooling can reach 127.0.0.1:18083.
  proxy:
    image: ${CADDY_IMAGE:?Set a reviewed Caddy image digest}
    restart: unless-stopped
    environment:
      CANESIGHT_DOMAIN: ${CANESIGHT_DOMAIN:?Set the backend DNS hostname}
      CANESIGHT_UPSTREAM: ${CANESIGHT_UPSTREAM:-127.0.0.1:18083}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    depends_on:
      backend:
        # Operator enrollment must work before model/source readiness is true.
        condition: service_started
volumes:
  caddy_data:
    name: ${CADDY_DATA_VOLUME:-canesight_caddy_data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME:-canesight_caddy_config}
